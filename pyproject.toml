[project]
name = "cormon"
version = "0.1.0"
description = "Correspondence monitor for clinical trials (board demo build)"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40",
  "pypdf>=6.21.4",
  "certifi>=2026.10.19",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.18",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "python-dateutil>=2.9",
  "tzdata",
  "google-api-python-client>=2.100",
  "google-auth>=2.20",
  "google-auth-oauthlib>=1.0",
  "msal>=1.28",
  "requests>=2.31",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
export = ["python-docx>=1.1", "openpyxl>=3.1"]
detector = ["onnxruntime>=1.20", "tokenizers>=0.20", "numpy>=1.26"]   # features.trick_detector

[project.scripts]
cormon = "cormon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cormon*"]
