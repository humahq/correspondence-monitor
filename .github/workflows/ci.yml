# Release gate (SDL-05, VAL-05, CFG-02, CAP-09). Every change runs the code tests and the AI test sets that
# config/gates.yaml ties to the files changed since the live version (tag `live`). Once a week every set runs
# with no kept AI answers, to catch a change on the model supplier's side. deploy/release.sh deploys only a
# commit whose "gate" job passed.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      all:
        description: Run every AI test set
        type: boolean
        default: false

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sets: ${{ steps.plan.outputs.sets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pyyaml
      - id: plan
        run: |
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ inputs.all }}" = true ]; then
            python -m cormon.gate plan --all
          else
            python -m cormon.gate plan --base live
          fi

  code-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          pip install -r deploy/requirements-live.txt pytest
          pip install --no-deps -e .
      - run: python -m pytest -q tests

  ai-tests:
    needs: plan
    if: needs.plan.outputs.sets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        set: ${{ fromJSON(needs.plan.outputs.sets) }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CORMON_HOME: ${{ github.workspace }}/.gate-home
      CORMON_OPERATOR: gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          pip install -r deploy/requirements-live.txt
          pip install --no-deps -e .
      - run: env -u CORMON_HOME python -m cormon.gate home "$CORMON_HOME"
      - name: Kept AI answers (not on the weekly run)
        if: github.event_name != 'schedule'
        uses: actions/cache@v4
        with:
          path: .gate-home/cache.db
          key: ai-answers-${{ matrix.set }}-${{ github.run_id }}
          restore-keys: ai-answers-${{ matrix.set }}-
      - run: python -m cormon.gate run ${{ matrix.set }} gate-out/${{ matrix.set }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.set }}
          path: gate-out/${{ matrix.set }}
          retention-days: 90

  gate:
    needs: [plan, code-tests, ai-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every required job passed
        run: |
          echo "sets: ${{ needs.plan.outputs.sets }}"
          echo "plan ${{ needs.plan.result }}, code tests ${{ needs.code-tests.result }}, AI tests ${{ needs.ai-tests.result }}"
          [ "${{ needs.plan.result }}" = success ] && [ "${{ needs.code-tests.result }}" = success ] || exit 1
          case "${{ needs.ai-tests.result }}" in success|skipped) ;; *) exit 1 ;; esac
