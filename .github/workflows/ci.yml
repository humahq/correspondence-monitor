# Release gate (SDL-02, SDL-05, VAL-05, CFG-02, CAP-09). Every change runs the code tests and the AI test sets that
# config/gates.yaml ties to the files changed since the live version (tag `live`). Once a week every set runs
# with no kept AI answers, to catch a change on the model supplier's side, and its answers become the kept ones.
# A merge takes its pull request's kept answers, so the next change only pays for what it changed.
# deploy/release.sh deploys only a commit whose "gate" job passed.
# Model drift (VAL-07): a fresh run (weekly, or by hand with "fresh") compares each case with the last fresh run
# that passed, and leaves a "fresh-check" file; deploy/release.sh stops unless the newest one passed and is at
# most 8 days old.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      all:
        description: Run every AI test set
        type: boolean
        default: false
      fresh:
        description: Ask every set fresh, with no kept answers, and compare with the last fresh run (as the weekly run)
        type: boolean
        default: false
      accept_changes:
        description: With fresh, more changes than allowed do not fail (a wanted change, e.g. a new model)
        type: boolean
        default: false

concurrency:
  # a merge does not cancel a fresh run
  group: gate-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.fresh) && 'fresh' || 'change' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      sets: ${{ steps.plan.outputs.sets }}
      kept_sets: ${{ steps.plan.outputs.kept_sets }}
      from_run: ${{ steps.plan.outputs.from_run }}
      fresh: ${{ steps.plan.outputs.fresh }}
      baseline_run: ${{ steps.plan.outputs.baseline_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pyyaml
      - id: plan
        run: |
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ inputs.fresh }}" = true ]; then
            base=$(python -m cormon.gate last-fresh)   # GitHub not reachable: the run stops, not compared silently
            printf 'fresh=true\nbaseline_run=%s\n' "$base" >> "$GITHUB_OUTPUT"
            python -m cormon.gate plan --all
          elif [ "${{ inputs.all }}" = true ]; then
            python -m cormon.gate plan --all
          elif [ "${{ github.event_name }}" = push ]; then
            # merging a pull request whose run passed on exactly this code does not run its AI sets again
            python -m cormon.gate plan --base live --reuse-pr
          else
            python -m cormon.gate plan --base live
          fi

  # SDL-02: every commit since the live version names the GitHub issue (or pull request) it is for, e.g. "#12".
  tasks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pyyaml
      - run: |
          python -m cormon.gate tasks --base live \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            ${{ github.event.pull_request.number && format('--pr {0}', github.event.pull_request.number) || '' }}

  code-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # The live packages, plus the laptop-only ones for building and exporting rules (Word and Excel files).
      - run: |
          pip install -r deploy/requirements-live.txt pytest==9.1.1 python-docx==1.2.0 openpyxl==3.1.5
          pip install --no-deps -e .
      - run: python -m pytest -q tests

  ai-tests:
    needs: plan
    if: needs.plan.outputs.sets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read   # the last fresh run's results
    strategy:
      fail-fast: false
      matrix:
        set: ${{ fromJSON(needs.plan.outputs.sets) }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CORMON_HOME: ${{ github.workspace }}/.gate-home
      CORMON_OPERATOR: gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          pip install -r deploy/requirements-live.txt
          pip install --no-deps -e .
      - run: env -u CORMON_HOME python -m cormon.gate home "$CORMON_HOME"
      # The kept AI answers: an unchanged input is not asked again, so it costs nothing and gets the same answer.
      # The weekly run asks everything fresh, and its answers become the kept ones.
      - name: Kept AI answers (not on a fresh run)
        if: needs.plan.outputs.fresh != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .gate-home/cache.db
          key: ai-answers-${{ matrix.set }}-${{ github.run_id }}
          restore-keys: ai-answers-${{ matrix.set }}-
      - name: The last fresh run's results, to compare with (VAL-07)
        if: needs.plan.outputs.fresh == 'true' && needs.plan.outputs.baseline_run != ''
        continue-on-error: true   # a set the last fresh run did not have is not compared
        uses: actions/download-artifact@v4
        with:
          name: results-${{ matrix.set }}
          path: gate-baseline/${{ matrix.set }}
          run-id: ${{ needs.plan.outputs.baseline_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          args=()
          if [ -d "gate-baseline/${{ matrix.set }}" ]; then
            args=(--baseline "gate-baseline/${{ matrix.set }}" --baseline-run "${{ needs.plan.outputs.baseline_run }}")
            [ "${{ inputs.accept_changes }}" = true ] && args+=(--accept-changes)
          fi
          python -m cormon.gate run ${{ matrix.set }} gate-out/${{ matrix.set }} "${args[@]}"
      - name: Keep this run's AI answers
        if: always() && hashFiles('.gate-home/cache.db') != ''
        uses: actions/cache/save@v4
        with:
          path: .gate-home/cache.db
          key: ai-answers-${{ matrix.set }}-${{ github.run_id }}
      # a pull request's answers can't be read from main's cache, so main takes them from here when it merges
      - if: always() && github.event_name == 'pull_request' && hashFiles('.gate-home/cache.db') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ai-answers-${{ matrix.set }}
          path: .gate-home/cache.db
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.set }}
          path: gate-out/${{ matrix.set }}
          retention-days: 90

  # After a merge whose AI sets already passed on the pull request, its kept answers become main's, so the next
  # pull request starts from them (no AI calls here).
  keep-answers:
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.from_run != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        set: ${{ fromJSON(needs.plan.outputs.kept_sets) }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true   # a pull request run from before its answers were kept as a file
        with:
          name: ai-answers-${{ matrix.set }}
          path: .gate-home
          run-id: ${{ needs.plan.outputs.from_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: hashFiles('.gate-home/cache.db') != ''
        uses: actions/cache/save@v4
        with:
          path: .gate-home/cache.db
          key: ai-answers-${{ matrix.set }}-${{ github.run_id }}

  gate:
    needs: [plan, tasks, code-tests, ai-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # VAL-07: deploy/release.sh finds the newest fresh run on main by this file and needs its gate passed.
      - if: needs.plan.outputs.fresh == 'true' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p fresh-check
          printf '{"run": %s, "commit": "%s", "event": "%s", "by": "%s", "accept_changes": %s, "ai_tests": "%s"}\n' \
            "${{ github.run_id }}" "${{ github.sha }}" "${{ github.event_name }}" "${{ github.actor }}" \
            "${{ inputs.accept_changes == true }}" "${{ needs.ai-tests.result }}" > fresh-check/fresh-check.json
      - if: needs.plan.outputs.fresh == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: fresh-check
          path: fresh-check
          retention-days: 90
      - name: Every required job passed
        run: |
          echo "sets: ${{ needs.plan.outputs.sets }}"
          echo "plan ${{ needs.plan.result }}, tasks ${{ needs.tasks.result }}, code tests ${{ needs.code-tests.result }}, AI tests ${{ needs.ai-tests.result }}"
          [ "${{ needs.plan.result }}" = success ] && [ "${{ needs.tasks.result }}" = success ] || exit 1
          [ "${{ needs.code-tests.result }}" = success ] || exit 1
          case "${{ needs.ai-tests.result }}" in success|skipped) ;; *) exit 1 ;; esac
