# Release gates (SDL-05, VAL-03, VAL-05, CFG-02, CAP-09). Read by `python -m cormon.gate`, run by
# .github/workflows/ci.yml on every change and once a week.
#
# A change runs the code tests and every set whose `when` matches a file changed since the live version
# (the git tag `live`, moved by deploy/release.sh). A set below a pass mark fails the run, and
# deploy/release.sh refuses to deploy a commit whose run did not pass. Pass marks are agreed before the runs
# and changed only through a reviewed commit to this file.
#
# Agreed with John, 29 Oct 2026. Each mark sits a little under the score of the version then live, so the
# normal wobble of the AI does not block a release but a real drop does.

study: NCT05842941

# Any of these changes runs every set: the model, its supplier library, or the gate itself.
all_when:
  - cormon/llm.py
  - deploy/requirements-live.txt
  - config/gates.yaml
  - cormon/gate.py
  - .github/workflows/ci.yml
# A change to the llm: or matching: block of config/settings.yaml (the models and how matching runs) also
# runs every set.

sets:
  findings:
    what: 100 practice DNL emails (finding problems)
    folder: demo/test-dnl
    marks:
      recall: 0.95       # of the real problems, how many were caught
      precision: 0.90    # of the alerts raised, how many were real
    when: &reading
      - cormon/reader.py
      - cormon/matching.py
      - cormon/events.py
      - cormon/pipeline.py
      - cormon/checks.py
      - cormon/packs.py
      - cormon/guide.py
      - cormon/ingest.py
      - cormon/duties.py
      - cormon/memory.py
      - cormon/conversation.py
      - cormon/triage.py
      - cormon/items.py
      - cormon/safety.py
      - cormon/capture.py
      - cormon/phi.py
      - cormon/textutil.py
      - cormon/config.py
      - cormon/db.py
      - cormon/service.py
      - cormon/testbench.py
      - cormon/channels/sim.py
      - config/triage.yaml
      - studies/*
      - demo/test-dnl/*

  # The trick emails (demo/test-injection, CAP-09) are left out for now, by John's decision on 30 Oct 2026;
  # they come back as a set here, with recipients_from_config: true, once the trick work resumes.

  questions:
    what: 100 practice site questions (QAA-04)
    file: demo/qa-g/questions.json
    marks:                    # raised 29 Oct once the grader saw every section the bot read (98% and 1% then)
      right_or_partly: 0.95   # correct or partly correct
      wrong_at_most: 0.03
    when:
      - cormon/answers.py
      - cormon/asks.py
      - cormon/reader.py
      - cormon/guide.py
      - cormon/packs.py
      - cormon/memory.py
      - cormon/conversation.py
      - cormon/outcheck.py
      - cormon/careful.py
      - cormon/privacy.py
      - config/privacy.yaml
      - cormon/language.py
      - cormon/recipients.py
      - cormon/ingest.py
      - cormon/config.py
      - cormon/db.py
      - cormon/qabench.py
      - studies/*
      - demo/qa-g/*

  wording:
    what: AI rewordings that add a fact or a medical judgment, and fair ones (OUT-04, QAA-06)
    file: demo/test-wording/cases.json
    marks:
      right: 1.0              # every one
    when:
      - cormon/outcheck.py
      - cormon/drafting.py
      - cormon/careful.py
      - cormon/answers.py
      - config/templates.yaml
      - config/careful.yaml
      - demo/test-wording/*

  doctors:
    what: 28 chat posts with the PI in the room (QAA-05)
    script: demo/doctor-check/real_world.py
    marks:
      show: [right]           # shown only: no pass mark agreed yet
    when:
      - cormon/careful.py
      - cormon/drafting.py
      - cormon/outcheck.py
      - cormon/routing.py
      - cormon/rooms.py
      - config/careful.yaml
      - config/templates.yaml
      - config/routing.yaml
      - demo/doctor-check/real_world.py
      - demo/doctor-check/real_world.json
