# Message templates, selected along four axes at once:
#   topic      pattern class id (eligibility, consent, ...), or a system topic
#              (safety_out_of_scope, copy_nudge, digest), or "*"
#   recipient  role id (cra, clinops_lead, crc), study_team, alert_channel, sender, or "*"
#   channel    email | teams | "*"
#   severity   low | medium | immediate | "*"
# The most specific match wins (each non-"*" axis counts one point).
#
# Templates are deterministic Jinja. Set `ai_edit: true` to let the model
# tighten the wording; its output is rejected unless every study fact survives.
# Rendering fails if any variable is missing, so no placeholder can go out.
#
# Voice: lead with the finding or the ask, name the actor ("I asked ..."), one block per problem
# (title, Next: step, then its evidence), keep every hedge and reply command as it is.

templates:

  # ---------------- Teams: study channel (running stream) ----------------
  - id: teams-study-item
    topic: "*"
    recipient: study_team
    channel: teams
    severity: "*"
    body: |
      <p><b>{{ item.tier_label }} · {{ study.short_name }} · {{ item.participant_id or "participant not named" }} · {{ item.site }}</b></p>
      {%- for p in problems %}
      <p><b>{{ p.n }}. {{ p.title }}</b>{% if bundle %} ({{ p.tier_label }}, Item #{{ p.item_id }}){% endif %}{% if p.unsure %} <i>(not sure, please check)</i>{% endif %}{% if p.detail %}<br>{{ p.detail }}{% endif %}<br>Next: {{ p.next_step or "Check this with the site." }}</p>
      <p>{{ finding.wrote | default('Site wrote') }} ({{ finding.sender_name }}, {{ finding.message_date }}):<br><code>{{ p.message_quote }}</code>{% for e in p.earlier_quotes %}<br>Earlier message ({{ e.when }}):<br><code>{{ e.words }}</code>{% endfor %}<br>Study rule: {% if p.doc_quote %}<code>{{ p.doc_quote }}</code> <i>From: {{ p.where }}</i>{% else %}<i>exact words not found, please read this section: {{ p.where }}</i>{% endif %}{% if p.unsure %}<br><i>Why not sure: {{ p.unsure_reason }}</i>{% endif %}</p>
      {%- endfor %}
      {%- if finding.earlier %}
      <p>(Part of this is from an earlier message: {{ finding.earlier }}.)</p>
      {%- endif %}
      <p>Notified: {{ item.routed_to }} · {% if bundle %}Items {% for p in problems %}#{{ p.item_id }}{{ ", " if not loop.last }}{% endfor %}{% else %}Item #{{ item.id }}{% endif %} · <a href="{{ item.link }}">details</a></p>

  - id: teams-study-good-news
    topic: good_news
    recipient: study_team
    channel: teams
    severity: "*"
    body: |
      <p><b>Good news · {{ study.short_name }} · {{ item.participant_id or "study" }} · {{ item.site }}</b></p>
      <p>{{ item.title }}</p>
      <p><b>{% if finding.sender_is_site | default(true) %}{{ finding.sender_name }} (site) wrote{% else %}{{ finding.sender_name }} ({{ finding.sender_role | lower }}) wrote{% endif %}</b> ({{ finding.message_date }}):<br><i>"{{ finding.message_quote }}"</i></p>
      <p>Item #{{ item.id }} · I added it to {{ people.cra.name }}'s list</p>

  # ---------------- Teams: alert channel (immediate only) ----------------
  - id: teams-alert
    topic: "*"
    recipient: alert_channel
    channel: teams
    severity: immediate
    body: |
      <p><b>{{ item.tier_label }} · {{ study.short_name }} · {{ item.participant_id or "participant not named" }} · {{ item.site }}</b></p>
      <p>I asked {{ people.cra.name }} (CRA) to call the site today.</p>
      {%- for p in problems %}
      <p><b>{{ p.n }}. {{ p.title }}</b>{% if bundle %} ({{ p.tier_label }}, Item #{{ p.item_id }}){% endif %}{% if p.unsure %} <i>(not sure, please check)</i>{% endif %}{% if p.detail %}<br>{{ p.detail }}{% endif %}<br>Next: {{ p.next_step or "Check this with the site." }}</p>
      <p>{{ finding.wrote | default('Site wrote') }}:<br><code>{{ p.message_quote }}</code>{% for e in p.earlier_quotes %}<br>Earlier message ({{ e.when }}):<br><code>{{ e.words }}</code>{% endfor %}<br>Study rule: {% if p.doc_quote %}<code>{{ p.doc_quote }}</code> <i>From: {{ p.where }}</i>{% else %}<i>exact words not found, please read this section: {{ p.where }}</i>{% endif %}</p>
      {%- endfor %}
      <p>Item #{{ item.id }} · <a href="{{ item.link }}">details</a></p>

  # ---------------- Email: CRA ----------------
  - id: email-cra-medium-eligibility
    topic: eligibility
    recipient: cra
    channel: email
    severity: medium
    subject: "[{{ study.short_name }}] Eligibility check needed: {{ item.participant_id or 'participant' }} at {{ item.site }}{% if problems | length > 1 %} (+{{ problems | length - 1 }} more){% endif %} (Item #{{ item.id }})"
    body: |
      {{ recipient.first_name }},

      {{ item.participant_id or "The participant" }} at {{ item.site }} may not meet the study's eligibility requirements. Please confirm with the site within two days whether this is a deviation, and record it if so.
      {%- for p in problems %}

      **{{ p.n }}. {{ p.title }}**{% if bundle %} ({{ p.tier_label }}, Item #{{ p.item_id }}){% endif %}{% if p.unsure %} (not sure, please check){% endif %}
      {%- if p.detail %}
      {{ p.detail }}
      {%- endif %}
      Next: {{ p.next_step or "Check this with the site." }}
      {{ finding.wrote | default('Site wrote') }} ({{ finding.sender_name }}, {{ finding.message_date }}):
      > {{ p.message_quote | replace("\n", " ") }}
      {%- for e in p.earlier_quotes %}
      Earlier message ({{ e.when }}):
      > {{ e.words }}
      {%- endfor %}
      Study rule:
      {%- if p.doc_quote %}
      > {{ p.doc_quote | replace("\n", " ") }}
      From: {{ p.where }}
      {%- else %}
      (exact words not found, please read this section: {{ p.where }})
      {%- endif %}
      {%- if p.unsure %}
      Why not sure: {{ p.unsure_reason }}
      {%- endif %}
      {%- endfor %}
      {%- if finding.earlier %}

      (Part of this is from an earlier email: {{ finding.earlier }}.)
      {%- endif %}

      Details: {{ item.link }}
      {% if bundle %}Reply "cleared" once all of these are resolved, or name one: "cleared #{{ problems[-1].item_id }}". "disregard" works the same way.{% else %}Reply "cleared" once it is resolved, or "disregard" to have me drop it.{% endif %}

      {{ study.monitor_signature }}

  - id: email-cra-medium
    topic: "*"
    recipient: cra
    channel: email
    severity: medium
    subject: "[{{ study.short_name }}] Needs action in 1-2 days: {{ item.title }}{% if problems | length > 1 %} (+{{ problems | length - 1 }} more){% endif %} (Item #{{ item.id }})"
    body: |
      {{ recipient.first_name }},

      Please follow up with the site within two days on {{ problems | length }} item{% if problems | length > 1 %}s{% endif %} for {{ item.participant_id or "a participant not named" }} at {{ item.site }}:
      {%- for p in problems %}

      **{{ p.n }}. {{ p.title }}**{% if bundle %} ({{ p.tier_label }}, Item #{{ p.item_id }}){% endif %}{% if p.unsure %} (not sure, please check){% endif %}
      {%- if p.detail %}
      {{ p.detail }}
      {%- endif %}
      Next: {{ p.next_step or "Check this with the site." }}
      {{ finding.wrote | default('Site wrote') }} ({{ finding.sender_name }}, {{ finding.message_date }}):
      > {{ p.message_quote | replace("\n", " ") }}
      {%- for e in p.earlier_quotes %}
      Earlier message ({{ e.when }}):
      > {{ e.words }}
      {%- endfor %}
      Study rule:
      {%- if p.doc_quote %}
      > {{ p.doc_quote | replace("\n", " ") }}
      From: {{ p.where }}
      {%- else %}
      (exact words not found, please read this section: {{ p.where }})
      {%- endif %}
      {%- if p.unsure %}
      Why not sure: {{ p.unsure_reason }}
      {%- endif %}
      {%- endfor %}
      {%- if finding.earlier %}

      (Part of this is from an earlier email: {{ finding.earlier }}.)
      {%- endif %}

      Details: {{ item.link }}
      {% if bundle %}Reply "cleared" once all of these are resolved, or name one: "cleared #{{ problems[-1].item_id }}". "disregard" works the same way.{% else %}Reply "cleared" once it is resolved, or "disregard" to have me drop it.{% endif %}

      {{ study.monitor_signature }}

  - id: email-cra-low
    topic: "*"
    recipient: cra
    channel: email
    severity: low
    subject: "[{{ study.short_name }}] For your to-do list: {{ item.title }}{% if problems | length > 1 %} (+{{ problems | length - 1 }} more){% endif %} (Item #{{ item.id }})"
    body: |
      {{ recipient.first_name }},

      {{ problems | length }} item{% if problems | length > 1 %}s{% endif %} for {{ item.participant_id or "a participant not named" }} at {{ item.site }} can wait for your next follow-up with the site, so nothing here needs action today.
      {%- for p in problems %}

      **{{ p.n }}. {{ p.title }}**{% if bundle %} ({{ p.tier_label }}, Item #{{ p.item_id }}){% endif %}{% if p.unsure %} (not sure, please check){% endif %}
      {%- if p.detail %}
      {{ p.detail }}
      {%- endif %}
      Next: {{ p.next_step or "Check this with the site." }}
      {{ finding.wrote | default('Site wrote') }} ({{ finding.sender_name }}, {{ finding.message_date }}):
      > {{ p.message_quote | replace("\n", " ") }}
      {%- for e in p.earlier_quotes %}
      Earlier message ({{ e.when }}):
      > {{ e.words }}
      {%- endfor %}
      Study rule:
      {%- if p.doc_quote %}
      > {{ p.doc_quote | replace("\n", " ") }}
      From: {{ p.where }}
      {%- else %}
      (exact words not found, please read this section: {{ p.where }})
      {%- endif %}
      {%- if p.unsure %}
      Why not sure: {{ p.unsure_reason }}
      {%- endif %}
      {%- endfor %}
      {%- if finding.earlier %}

      (Part of this is from an earlier email: {{ finding.earlier }}.)
      {%- endif %}

      Details: {{ item.link }}
      {% if bundle %}Reply "cleared" once all of these are resolved, or name one: "cleared #{{ problems[-1].item_id }}". "disregard" works the same way.{% else %}Reply "cleared" once it is resolved, or "disregard" to have me drop it.{% endif %}

      {{ study.monitor_signature }}

  - id: email-cra-immediate
    topic: "*"
    recipient: cra
    channel: email
    severity: immediate
    subject: "URGENT [{{ study.short_name }}] Call {{ item.site }} today: {{ item.participant_id or 'participant' }} (Item #{{ item.id }})"
    body: |
      {{ recipient.first_name }},

      Please call {% if finding.sender_is_site | default(true) %}{{ people.crc.name }} at {{ item.site }}{% else %}{{ finding.sender_name }} ({{ finding.sender_role }}), who sent it,{% endif %} today about {{ problems | length }} problem{{ "s" if problems | length > 1 }} for {{ item.participant_id or "a participant not named" }}:
      {%- for p in problems %}

      **{{ p.n }}. {{ p.title }}**{% if bundle %} ({{ p.tier_label }}, Item #{{ p.item_id }}){% endif %}{% if p.unsure %} (not sure, please check){% endif %}
      {%- if p.detail %}
      {{ p.detail }}
      {%- endif %}
      Next: {{ p.next_step or "Check this with the site." }}
      {{ finding.wrote | default('Site wrote') }} ({{ finding.sender_name }}, {{ finding.message_date }}):
      > {{ p.message_quote | replace("\n", " ") }}
      {%- for e in p.earlier_quotes %}
      Earlier message ({{ e.when }}):
      > {{ e.words }}
      {%- endfor %}
      Study rule:
      {%- if p.doc_quote %}
      > {{ p.doc_quote | replace("\n", " ") }}
      From: {{ p.where }}
      {%- else %}
      (exact words not found, please read this section: {{ p.where }})
      {%- endif %}
      {%- if p.unsure %}
      Why not sure: {{ p.unsure_reason }}
      {%- endif %}
      {%- endfor %}
      {%- if finding.earlier %}

      (Part of this is from an earlier email: {{ finding.earlier }}.)
      {%- endif %}

      {% if finding.sender_is_site | default(true) %}I told the site only that a possible issue was noted and that you have been informed. {% endif %}I told {{ people.clinops_lead.name }} (sponsor) that you are in touch with the site.

      Details: {{ item.link }}
      {% if bundle %}Reply "cleared" once all of these are resolved, or name one: "cleared #{{ problems[-1].item_id }}". "disregard" works the same way.{% else %}Reply "cleared" once it is resolved, or "disregard" to have me drop it.{% endif %}

      {{ study.monitor_signature }}

  # ---------------- Email: sponsor ClinOps lead ----------------
  - id: email-sponsor-immediate
    topic: "*"
    recipient: clinops_lead
    channel: email
    severity: immediate
    subject: "Urgent, for your awareness [{{ study.short_name }}]: {{ item.site }}, {{ item.participant_id or 'participant' }} (Item #{{ item.id }})"
    body: |
      {{ recipient.first_name }},

      No action is needed from you. I flagged a possible urgent issue at {{ item.site }}: {{ item.title.rstrip('.') }}.

      I asked {{ people.cra.name }} (CRA), who has the context, to call the site today.
      {%- if finding.sender_is_site | default(true) %}
      I told {{ people.crc.name }} (site coordinator) that a possible issue was noted and that their monitor is aware.
      {%- endif %}

      The study rule ({{ finding.where }}){% if finding.doc_quote %}: "{{ finding.doc_quote }}"{% else %}: exact words not found, please read this section.{% endif %}
      {%- for a in also %}
      It also goes against this rule ({{ a.where }}){% if a.doc_quote %}: "{{ a.doc_quote }}"{% else %}: exact words not found, please read this section.{% endif %}
      {%- endfor %}

      Details: {{ item.link }}

      {{ study.monitor_signature }}

  # ---------------- Email: site coordinator (hedged notice) ----------------
  # Reviewed against Section 4.6: says what was flagged, asserts no conclusion,
  # gives no clinical or stop instruction.
  - id: email-site-notice
    topic: "*"
    recipient: crc
    channel: email
    severity: immediate
    subject: "Re: {{ finding.message_subject }}"
    body: |
      {{ recipient.first_name }},

      I noticed something in your message about {{ item.participant_id or "a participant" }} that may not match the study's {{ item.pattern_label | lower }} requirements. I have not confirmed it.

      I have told your monitor, {{ people.cra.name }}, who will be in touch with you.

      {{ study.monitor_signature }}

  # ---------------- Email: an alert kept private because a doctor can read the chat (config/careful.yaml) ----------------
  - id: email-careful-report
    topic: careful_report
    recipient: "*"
    channel: email
    severity: "*"
    subject: "[{{ study.short_name }}] Private: {{ item.title }}{% if problems | length > 1 %} (+{{ problems | length - 1 }} more){% endif %} (Item #{{ item.id }})"
    body: |
      {{ recipient.first_name }},

      This alert was not posted in any chat and is sent to you privately: {{ careful.why }}.
      Please follow it up directly and calmly, without raising it in front of others.

      **{{ problems | length }} problem{{ "s" if problems | length > 1 }} for {{ item.participant_id or "participant not named" }} at {{ item.site }} ({{ item.tier_label }}):**
      {%- for p in problems %}
      **{{ p.n }}. {{ p.title }}**{% if bundle %} ({{ p.tier_label }}, Item #{{ p.item_id }}){% endif %}{% if p.unsure %} (not sure, please check){% endif %}
      {%- if p.detail %}
      {{ p.detail }}
      {%- endif %}
      {%- endfor %}

      **What to do:**
      {%- for p in problems %}
      {{ p.n }}. {{ p.next_step or "Check this with the site." }}
      {%- endfor %}

      ──────────
      {%- for p in problems %}

      **Evidence for problem {{ p.n }}**
      {{ finding.wrote | default('Site wrote') }} ({{ finding.sender_name }}, {{ finding.message_date }}):
      > {{ p.message_quote | replace("\n", " ") }}
      Study rule:
      {%- if p.doc_quote %}
      > {{ p.doc_quote | replace("\n", " ") }}
      From: {{ p.where }}
      {%- else %}
      (exact words not found, please read this section: {{ p.where }})
      {%- endif %}
      {%- endfor %}

      Details: {{ item.link }}

      {{ study.monitor_signature }}

  # ---------------- Out of scope: safety ----------------
  - id: email-safety-redirect
    topic: safety_out_of_scope
    recipient: "*"
    channel: email
    severity: "*"
    subject: "Re: {{ finding.message_subject }}"
    body: |
      {{ recipient.first_name }},

      I do not review safety information. I have not assessed this message or passed it on for safety review.

      Please take it to {{ people.medical_monitor.name or "the study's medical monitor" }} and follow the protocol's safety reporting process.

      {{ study.monitor_signature }}

  - id: email-safety-to-medical-monitor
    topic: safety_for_medical_monitor
    recipient: medical_monitor
    channel: email
    severity: "*"
    subject: "Possible safety information · {{ study.short_name }} · {{ item.participant_id or 'participant not named' }}"
    body: |
      {{ recipient.first_name }},

      A message to the study may contain safety information about a participant. I do not review safety
      information: I have not assessed it, and I have not replied to the sender about it. Please review it.

      Participant: {{ item.participant_id or "not named" }} · {{ item.site }}
      From: {{ finding.sender_name }}, {{ finding.message_date }}
      Subject: {{ finding.message_subject }}

      What they wrote:
      "{{ finding.message_quote }}"

      The full message: {{ item.link }}

      {{ study.monitor_signature }}

  # ---------------- Copy nudge after the bot was dropped from a thread ----------------
  - id: email-copy-nudge
    topic: copy_nudge
    recipient: "*"
    channel: email
    severity: "*"
    subject: "Re: {{ finding.message_subject }}"
    body: |
      {{ recipient.first_name }},

      I missed part of this thread and have now read the messages. Please keep {{ study.alias }} copied on all study correspondence, including replies, so the record stays complete.

      Thank you.

      {{ study.monitor_signature }}

  # ---------------- Digest ----------------
  - id: email-digest
    topic: digest
    recipient: "*"
    channel: email
    severity: "*"
    subject: "Daily correspondence digest, {{ digest.date }}: {{ digest.total }} item(s)"
    body: |
      {{ recipient.first_name }},

      Here is the study correspondence I reviewed for {{ digest.window }}.
      {%- for s in digest.studies %}

      == {{ s.short_name }} ({{ s.study_id }}) ==
      {%- for group in s.groups %}

      {{ group.label }}: {{ group.entries | length }}
      {%- for i in group.entries %}
        #{{ i.id }} [{{ i.tier_label }}] {{ i.site }} · {{ i.participant_id or "-" }} · {{ i.title }}
      {%- endfor %}
      {%- endfor %}
      {%- endfor %}
      {%- if not digest.studies %}

      No items in this window.
      {%- endif %}

      {{ digest.footer }}
