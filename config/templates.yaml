# Message templates, selected along four axes at once:
#   topic      pattern class id (eligibility, consent, ...), or a system topic
#              (safety_out_of_scope, copy_nudge, digest), or "*"
#   recipient  role id (cra, clinops_lead, crc), study_team, alert_channel, sender, or "*"
#   channel    email | teams | "*"
#   severity   low | medium | immediate | "*"
# The most specific match wins (each non-"*" axis counts one point).
#
# Templates are deterministic Jinja. Set `ai_edit: true` to let the model
# tighten the wording; its output is rejected unless every study fact survives.
# Rendering fails if any variable is missing, so no placeholder can go out.

templates:

  # ---------------- Teams: study channel (running stream) ----------------
  - id: teams-study-item
    topic: "*"
    recipient: study_team
    channel: teams
    severity: "*"
    body: |
      <p><b>{{ item.tier_label }} · {{ study.short_name }} · {{ item.participant_id or "participant not named" }} · {{ item.site }}</b></p>
      <p><b>{{ problems | length }} problem{{ "s" if problems | length > 1 }} found:</b>
      {%- for p in problems %}<br><b>{{ p.n }}. {{ p.title }}</b>{% if bundle %} ({{ p.tier_label }}, Item #{{ p.item_id }}){% endif %}{% if p.unsure %} <i>(please check: not sure)</i>{% endif %}{% if p.detail %}<br>{{ p.detail }}{% endif %}{% endfor %}</p>
      <p><b>What to do:</b>
      {%- for p in problems %}<br>{{ p.n }}. {{ p.next_step or "Check this with the site." }}{% endfor %}</p>
      <p>──────────</p>
      {%- for p in problems %}
      <p><b>Evidence for problem {{ p.n }}</b><br>Site wrote ({{ finding.sender_name }}, {{ finding.message_date }}):<br><code>{{ p.message_quote }}</code>{% for e in p.earlier_quotes %}<br>Earlier message ({{ e.when }}):<br><code>{{ e.words }}</code>{% endfor %}<br>Study rule:<br>{% if p.doc_quote %}<code>{{ p.doc_quote }}</code><br><i>From: {{ p.where }}</i>{% else %}<i>exact words not found, please read this section: {{ p.where }}</i>{% endif %}
      {%- if p.unsure %}<br><i>Why not sure: {{ p.unsure_reason }}</i>{% endif %}</p>
      {%- endfor %}
      {%- if finding.earlier %}
      <p>(Part of this is from an earlier message: {{ finding.earlier }}.)</p>
      {%- endif %}
      <p>Told: {{ item.routed_to }} · {% if bundle %}Items {% for p in problems %}#{{ p.item_id }}{{ ", " if not loop.last }}{% endfor %}{% else %}Item #{{ item.id }}{% endif %} · <a href="{{ item.link }}">details</a></p>

  - id: teams-study-good-news
    topic: good_news
    recipient: study_team
    channel: teams
    severity: "*"
    body: |
      <p><b>Good news · {{ study.short_name }} · {{ item.participant_id or "study" }} · {{ item.site }}</b></p>
      <p>{{ item.title }}</p>
      <p><b>What the site wrote</b> ({{ finding.sender_name }}, {{ finding.message_date }}):<br><i>"{{ finding.message_quote }}"</i></p>
      <p>Item #{{ item.id }} · added to the CRA's to-do list</p>

  # ---------------- Teams: alert channel (immediate only) ----------------
  - id: teams-alert
    topic: "*"
    recipient: alert_channel
    channel: teams
    severity: immediate
    body: |
      <p><b>{{ item.tier_label }} · {{ study.short_name }} · {{ item.participant_id or "participant not named" }} · {{ item.site }}</b></p>
      <p><b>{{ problems | length }} problem{{ "s" if problems | length > 1 }} found:</b>
      {%- for p in problems %}<br><b>{{ p.n }}. {{ p.title }}</b>{% if bundle %} ({{ p.tier_label }}, Item #{{ p.item_id }}){% endif %}{% if p.unsure %} <i>(please check: not sure)</i>{% endif %}{% if p.detail %}<br>{{ p.detail }}{% endif %}{% endfor %}</p>
      <p><b>What to do:</b><br>{{ people.cra.name }} (CRA) has been asked to call the site today.
      {%- for p in problems %}<br>{{ p.n }}. {{ p.next_step or "Check this with the site." }}{% endfor %}</p>
      <p>──────────</p>
      {%- for p in problems %}
      <p><b>Evidence for problem {{ p.n }}</b><br>Site wrote:<br><code>{{ p.message_quote }}</code>{% for e in p.earlier_quotes %}<br>Earlier message ({{ e.when }}):<br><code>{{ e.words }}</code>{% endfor %}<br>Study rule:<br>{% if p.doc_quote %}<code>{{ p.doc_quote }}</code><br><i>From: {{ p.where }}</i>{% else %}<i>exact words not found, please read this section: {{ p.where }}</i>{% endif %}</p>
      {%- endfor %}
      <p>Item #{{ item.id }} · <a href="{{ item.link }}">details</a></p>

  # ---------------- Email: CRA ----------------
  - id: email-cra-medium-eligibility
    topic: eligibility
    recipient: cra
    channel: email
    severity: medium
    subject: "[{{ study.short_name }}] Eligibility check needed: {{ item.participant_id or 'participant' }} at {{ item.site }}{% if problems | length > 1 %} (+{{ problems | length - 1 }} more){% endif %} (Item #{{ item.id }})"
    body: |
      {{ recipient.first_name }},

      **{{ problems | length }} problem{{ "s" if problems | length > 1 }} for {{ item.participant_id or "participant not named" }} at {{ item.site }}:**
      {%- for p in problems %}
      **{{ p.n }}. {{ p.title }}**{% if bundle %} ({{ p.tier_label }}, Item #{{ p.item_id }}){% endif %}{% if p.unsure %} (please check: not sure){% endif %}
      {%- if p.detail %}
      {{ p.detail }}
      {%- endif %}
      {%- endfor %}

      **What to do** (within two days): confirm with the site whether this is a deviation, and record it if so.
      {%- for p in problems %}
      {{ p.n }}. {{ p.next_step or "Check this with the site." }}
      {%- endfor %}

      ──────────
      {%- for p in problems %}

      **Evidence for problem {{ p.n }}**
      Site wrote ({{ finding.sender_name }}, {{ finding.message_date }}):
      > {{ p.message_quote | replace("\n", " ") }}
      {%- for e in p.earlier_quotes %}
      Earlier message ({{ e.when }}):
      > {{ e.words }}
      {%- endfor %}
      Study rule:
      {%- if p.doc_quote %}
      > {{ p.doc_quote | replace("\n", " ") }}
      From: {{ p.where }}
      {%- else %}
      (exact words not found, please read this section: {{ p.where }})
      {%- endif %}
      {%- if p.unsure %}
      Why not sure: {{ p.unsure_reason }}
      {%- endif %}
      {%- endfor %}
      {%- if finding.earlier %}

      (Part of this is from an earlier email: {{ finding.earlier }}.)
      {%- endif %}

      Details: {{ item.link }}
      {% if bundle %}Reply "cleared" once all of these are resolved, or name one: "cleared #{{ problems[-1].item_id }}". "disregard" works the same way.{% else %}To have me disregard this, reply "disregard". To clear it, reply "cleared".{% endif %}

      {{ study.monitor_signature }}

  - id: email-cra-medium
    topic: "*"
    recipient: cra
    channel: email
    severity: medium
    subject: "[{{ study.short_name }}] Needs action in 1-2 days: {{ item.title }}{% if problems | length > 1 %} (+{{ problems | length - 1 }} more){% endif %} (Item #{{ item.id }})"
    body: |
      {{ recipient.first_name }},

      **{{ problems | length }} problem{{ "s" if problems | length > 1 }} for {{ item.participant_id or "participant not named" }} at {{ item.site }}:**
      {%- for p in problems %}
      **{{ p.n }}. {{ p.title }}**{% if bundle %} ({{ p.tier_label }}, Item #{{ p.item_id }}){% endif %}{% if p.unsure %} (please check: not sure){% endif %}
      {%- if p.detail %}
      {{ p.detail }}
      {%- endif %}
      {%- endfor %}

      **What to do** (follow up with the site within two days):
      {%- for p in problems %}
      {{ p.n }}. {{ p.next_step or "Check this with the site." }}
      {%- endfor %}

      ──────────
      {%- for p in problems %}

      **Evidence for problem {{ p.n }}**
      Site wrote ({{ finding.sender_name }}, {{ finding.message_date }}):
      > {{ p.message_quote | replace("\n", " ") }}
      {%- for e in p.earlier_quotes %}
      Earlier message ({{ e.when }}):
      > {{ e.words }}
      {%- endfor %}
      Study rule:
      {%- if p.doc_quote %}
      > {{ p.doc_quote | replace("\n", " ") }}
      From: {{ p.where }}
      {%- else %}
      (exact words not found, please read this section: {{ p.where }})
      {%- endif %}
      {%- if p.unsure %}
      Why not sure: {{ p.unsure_reason }}
      {%- endif %}
      {%- endfor %}
      {%- if finding.earlier %}

      (Part of this is from an earlier email: {{ finding.earlier }}.)
      {%- endif %}

      Details: {{ item.link }}
      {% if bundle %}Reply "cleared" once all of these are resolved, or name one: "cleared #{{ problems[-1].item_id }}". "disregard" works the same way.{% else %}Reply "disregard" to have me drop this, or "cleared" once resolved.{% endif %}

      {{ study.monitor_signature }}

  - id: email-cra-low
    topic: "*"
    recipient: cra
    channel: email
    severity: low
    subject: "[{{ study.short_name }}] For your to-do list: {{ item.title }}{% if problems | length > 1 %} (+{{ problems | length - 1 }} more){% endif %} (Item #{{ item.id }})"
    body: |
      {{ recipient.first_name }},

      **{{ problems | length }} problem{{ "s" if problems | length > 1 }} for {{ item.participant_id or "participant not named" }} at {{ item.site }}:**
      {%- for p in problems %}
      **{{ p.n }}. {{ p.title }}**{% if bundle %} ({{ p.tier_label }}, Item #{{ p.item_id }}){% endif %}{% if p.unsure %} (please check: not sure){% endif %}
      {%- if p.detail %}
      {{ p.detail }}
      {%- endif %}
      {%- endfor %}

      **What to do** (no rush: raise it at your next follow-up with the site):
      {%- for p in problems %}
      {{ p.n }}. {{ p.next_step or "Check this with the site." }}
      {%- endfor %}

      ──────────
      {%- for p in problems %}

      **Evidence for problem {{ p.n }}**
      Site wrote ({{ finding.sender_name }}, {{ finding.message_date }}):
      > {{ p.message_quote | replace("\n", " ") }}
      {%- for e in p.earlier_quotes %}
      Earlier message ({{ e.when }}):
      > {{ e.words }}
      {%- endfor %}
      Study rule:
      {%- if p.doc_quote %}
      > {{ p.doc_quote | replace("\n", " ") }}
      From: {{ p.where }}
      {%- else %}
      (exact words not found, please read this section: {{ p.where }})
      {%- endif %}
      {%- if p.unsure %}
      Why not sure: {{ p.unsure_reason }}
      {%- endif %}
      {%- endfor %}
      {%- if finding.earlier %}

      (Part of this is from an earlier email: {{ finding.earlier }}.)
      {%- endif %}

      Details: {{ item.link }}
      {% if bundle %}Reply "cleared" once all of these are resolved, or name one: "cleared #{{ problems[-1].item_id }}". "disregard" works the same way.{% else %}Reply "disregard" to have me drop this, or "cleared" once resolved.{% endif %}

      {{ study.monitor_signature }}

  - id: email-cra-immediate
    topic: "*"
    recipient: cra
    channel: email
    severity: immediate
    subject: "URGENT [{{ study.short_name }}] Call {{ item.site }} today: {{ item.participant_id or 'participant' }} (Item #{{ item.id }})"
    body: |
      {{ recipient.first_name }},

      **{{ problems | length }} problem{{ "s" if problems | length > 1 }} for {{ item.participant_id or "participant not named" }} at {{ item.site }}:**
      {%- for p in problems %}
      **{{ p.n }}. {{ p.title }}**{% if bundle %} ({{ p.tier_label }}, Item #{{ p.item_id }}){% endif %}{% if p.unsure %} (please check: not sure){% endif %}
      {%- if p.detail %}
      {{ p.detail }}
      {%- endif %}
      {%- endfor %}

      **What to do** (today): please call {{ people.crc.name }} at {{ item.site }}, then:
      {%- for p in problems %}
      {{ p.n }}. {{ p.next_step or "Check this with the site." }}
      {%- endfor %}

      ──────────
      {%- for p in problems %}

      **Evidence for problem {{ p.n }}**
      Site wrote ({{ finding.sender_name }}, {{ finding.message_date }}):
      > {{ p.message_quote | replace("\n", " ") }}
      {%- for e in p.earlier_quotes %}
      Earlier message ({{ e.when }}):
      > {{ e.words }}
      {%- endfor %}
      Study rule:
      {%- if p.doc_quote %}
      > {{ p.doc_quote | replace("\n", " ") }}
      From: {{ p.where }}
      {%- else %}
      (exact words not found, please read this section: {{ p.where }})
      {%- endif %}
      {%- if p.unsure %}
      Why not sure: {{ p.unsure_reason }}
      {%- endif %}
      {%- endfor %}
      {%- if finding.earlier %}

      (Part of this is from an earlier email: {{ finding.earlier }}.)
      {%- endif %}

      The site has been told only that a possible issue was noted and that you have been informed. {{ people.clinops_lead.name }} (sponsor) has been told you are in touch with the site.

      Details: {{ item.link }}
      {% if bundle %}Reply "cleared" once all of these are resolved, or name one: "cleared #{{ problems[-1].item_id }}". "disregard" works the same way.{% else %}Reply "disregard" to have me drop this, or "cleared" once resolved.{% endif %}

      {{ study.monitor_signature }}

  # ---------------- Email: sponsor ClinOps lead ----------------
  - id: email-sponsor-immediate
    topic: "*"
    recipient: clinops_lead
    channel: email
    severity: immediate
    subject: "Urgent, for your awareness [{{ study.short_name }}]: {{ item.site }}, {{ item.participant_id or 'participant' }} (Item #{{ item.id }})"
    body: |
      {{ recipient.first_name }},

      For your awareness, no action needed from you. A possible urgent issue was flagged at {{ item.site }}: {{ item.title }}.

      What was routed:
      - {{ people.cra.name }} (CRA) has the context and has been asked to call the site today.
      - {{ people.crc.name }} (site coordinator) was told a possible issue was noted and that their monitor has been informed.

      The study rule ({{ finding.where }}){% if finding.doc_quote %}: "{{ finding.doc_quote }}"{% else %}: exact words not found, please read this section.{% endif %}
      {%- for a in also %}
      It also goes against this rule ({{ a.where }}){% if a.doc_quote %}: "{{ a.doc_quote }}"{% else %}: exact words not found, please read this section.{% endif %}
      {%- endfor %}

      Details: {{ item.link }}

      {{ study.monitor_signature }}

  # ---------------- Email: site coordinator (hedged notice) ----------------
  # Reviewed against Section 4.6: says what was flagged, asserts no conclusion,
  # gives no clinical or stop instruction.
  - id: email-site-notice
    topic: "*"
    recipient: crc
    channel: email
    severity: immediate
    subject: "Re: {{ finding.message_subject }}"
    body: |
      {{ recipient.first_name }},

      A possible issue was noted in your message about {{ item.participant_id or "a participant" }}, relating to the study's {{ item.pattern_label | lower }} requirements. This has not been confirmed.

      Your monitor, {{ people.cra.name }}, has been told and will be in touch with you.

      {{ study.monitor_signature }}

  # ---------------- Out of scope: safety ----------------
  - id: email-safety-redirect
    topic: safety_out_of_scope
    recipient: "*"
    channel: email
    severity: "*"
    subject: "Re: {{ finding.message_subject }}"
    body: |
      {{ recipient.first_name }},

      This monitor does not review safety information, and nothing in this message has been assessed or passed on for safety.

      Please take it to {{ people.medical_monitor.name or "the study's medical monitor" }} and follow the protocol's safety reporting process.

      {{ study.monitor_signature }}

  # ---------------- Copy nudge after the bot was dropped from a thread ----------------
  - id: email-copy-nudge
    topic: copy_nudge
    recipient: "*"
    channel: email
    severity: "*"
    subject: "Re: {{ finding.message_subject }}"
    body: |
      {{ recipient.first_name }},

      I was left off this thread for a while and have now read the messages I missed. Please keep {{ study.alias }} copied on all study correspondence, including replies, so the record stays complete.

      Thank you.

      {{ study.monitor_signature }}

  # ---------------- Digest ----------------
  - id: email-digest
    topic: digest
    recipient: "*"
    channel: email
    severity: "*"
    subject: "Daily correspondence digest, {{ digest.date }}: {{ digest.total }} item(s)"
    body: |
      {{ recipient.first_name }},

      Summary of study messages for {{ digest.window }}.
      {%- for s in digest.studies %}

      == {{ s.short_name }} ({{ s.study_id }}) ==
      {%- for group in s.groups %}

      {{ group.label }}: {{ group.entries | length }}
      {%- for i in group.entries %}
        #{{ i.id }} [{{ i.tier_label }}] {{ i.site }} · {{ i.participant_id or "-" }} · {{ i.title }}
      {%- endfor %}
      {%- endfor %}
      {%- endfor %}
      {%- if not digest.studies %}

      Nothing was found in this window.
      {%- endif %}

      {{ digest.footer }}
