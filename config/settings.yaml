# System settings. Changes are recorded in the audit log (who and when).
system:
  data_dir: data
  studies_dir: studies
  # The studies this copy runs. Leave empty to run every folder under studies/.
  studies: [NCT04098666, NCT05842941]
  poll_seconds: 20
  # How often each channel is read in full (empty: poll_seconds; Chat with push on: 60, catch-up only).
  chat_poll_seconds:
  email_poll_seconds:
  timezone: America/New_York

chat:
  # A quick "give me a moment" when someone asks the bot something in chat, before the slow read.
  receipt: true
  # One of these is picked at random each time; empty: the texts in cormon/pipeline.py (RECEIPTS).
  receipt_texts: []
  # A server with its own bot account posts in its own rooms, set in its settings.local.yaml:
  # {NCT05842941: {study_channel: {space: spaces/<id>, name: ...}, alert_channel: {...}}}. Empty: study.yaml's.
  rooms: {}

bot:
  # This deployment's name for the bot, as people see it in email, the admin pages and ops warnings.
  # Set it per deployment in config/settings.local.yaml (not committed); the Google Chat app's name in the
  # Cloud console should match. Empty: "Study monitor", with the usual automated-message disclaimer.
  name: ""
  avatar_url: ""
  signature: ""

matching:
  # Forwarded or attached content about events older than this is treated as historical (no alert),
  # so forwarding an old email does not turn an old event into a new one.
  forwarded_stale_days: 7
  # A second pass over the whole email against the whole rule list, so a problem the event-by-event check
  # misses is still found. Its findings go through the same quote, number and document checks.
  sweep: true

memory:
  # Patient memory in Hindsight (deploy/hindsight.sh, cormon/hindsight.py, docs/hindsight-plan.md): each study
  # message's facts are saved, tagged by participant. Off until it is switched on through a settings change.
  enabled: false
  url: http://127.0.0.1:8888
  key_file: secrets/hindsight_key
  # Test copies use their own banks, so test facts never mix with real ones.
  bank_prefix: ""
  # A search slower than this is given up (and logged): the answer goes out without memory.
  search_seconds: 5

# New features, each off on the live bot until John says "yes, put it in the live bot" (docs/features.md).
# Patient memory's switch is memory.enabled above.
features:
  permission_claims: true   # "Dr. Smith said it's fine": a permission passed on by someone else is not accepted
  second_look: true         # a second reading of the email's facts only, so words aimed at the AI can't hide a problem
  privacy_check: false       # who may hear what, before an answer or alert using patient memory goes out
  openbook_look: false       # the admin page in OpenBook's look (openbook.phd: its name, colors and font)
  numbered_steps: true       # a quote of numbered steps ("1. Click Add Subject") counts as the document's words
  language_courtesy: true    # in a chat, answer in a language everyone there reads, and say so kindly if not
  safety_names: true         # a safety email names the participant only for the medical monitor; copies don't
  outside_recipients: true   # an email with someone on it the study doesn't list gets no answer, only a note to the sender
  close_on_page: true        # an alert is closed on its page with three fixed choices; some wait for the PI's review
  trick_detector: false      # Meta's open-source trick detector flags a message that tries to give the AI orders; admins told
  mark_email: true          # the message is marked at both ends with its own tag and cleaned of invisible characters
  flag_orders: true         # a message giving the bot orders: admins told, and never a quiet "no problem" (please check)
  confirm_orders: false      # a second judge (Decisions API) must agree a sentence is an order before it is flagged
  safety_backstop: false     # a severe safety word the AI did not send to the medical monitor is sent anyway

# The language everyone in a study shares (language_courtesy). A person's own are `languages:` in study.yaml.
language:
  shared: English

# Who a safety email may name the participant for (safety_names), besides the site care team in privacy.yaml.
# Eliot, Nov 6: the medical monitor's own email may; the CRA, the sponsor and the escalation chain may not.
safety:
  names_for: [medical_monitor]

llm:
  temperature: 0
  seed: 7
  timeout_seconds: 600
  # Reasoning models (gpt-5 and later) take an effort instead of a temperature; per task under effort.
  reasoning_effort: low
  effort:
    ingest: high
    ingest_links: medium
    ingest_brief: medium
    read_confirm: medium
    privacy_check: medium   # the last check before an answer on a participant: who may hear what
  # The documents are read once by the strong model; every email is read by the fast one.
  models:
    default: gpt-5.4-mini
    ingest: gpt-6.1-sol
    extract: gpt-5.4-mini
    match: gpt-4.1        # rule-by-rule studies (NCT04098666)
    confirm: gpt-4.1
    draft_edit: gpt-5.4-mini

# Which channel adapters run. "sim" reads data/sim/inbox and writes data/sim/outbox,
# so the whole flow can be rehearsed without real accounts.
channels:
  email: imap       # imap | gmail | sim
  teams: gchat      # the chat channel: graph (Microsoft Teams) | gchat (Google Chat) | sim | off

mailbox:
  address: bot@huma.ai
  # Extra alternate addresses (Workspace aliases) mapped to a study id.
  aliases: {}
  # Addresses for general (non-study) messages. Bare bot@huma.ai also counts, but the IMAP reader skips it
  # because the scheduler owns that mail.
  general_addresses:
    - bot+clinical@huma.ai
  # IMAP/SMTP with a Gmail app password, shared with the scheduler on the same inbox.
  imap:
    user: bot@huma.ai
    host: imap.gmail.com
    smtp_host: smtp.gmail.com
    smtp_port: 465
    days: 3
    # Spam too: Gmail sometimes files new outside senders there. Only study-address mail is taken from it.
    folders: [INBOX, "[Gmail]/Spam"]
    # The scheduler also reads bot@huma.ai, so only bot+<study> mail is taken.
    only_study_aliases: true
    password_env: CORMON_GMAIL_APP_PASSWORD
    secret:
      project: optical-depth-506808-t0
      name: kol-gmail-bot-app-password
  gmail:
    auth: oauth                     # oauth | service_account
    client_secrets_file: secrets/gmail_client.json
    token_file: secrets/gmail_token.json
    service_account_file: secrets/gmail_sa.json
    query: "in:inbox newer_than:7d"
    processed_label: cormon-processed

teams:
  tenant_id: ""
  client_id: ""
  token_cache: secrets/teams_token.json
  # Direct 1:1 chats with the bot user are read as well.
  read_direct_chats: true

gchat:
  account: bot@huma.ai
  client_secrets_file: secrets/gchat_client.json
  token_file: secrets/gchat_token.json
  # Direct messages to the bot account are read as well.
  read_direct_chats: true
  # Push: Google sends a note to this Pub/Sub topic when a message is posted, so the bot reads Chat at once
  # instead of at the next poll. Empty: poll only. See cormon/channels/chat_events.py and `cormon chat-events`.
  events:
    topic: ""          # projects/PROJECT/topics/TOPIC
    subscription: ""   # projects/PROJECT/subscriptions/SUBSCRIPTION (pull)
    key_file: ""       # optional service account key for Pub/Sub; empty: the machine's own account

digest:
  # Local time the daily digest goes out, chosen so it is read at the start of the day.
  send_at: "07:30"
  timezone: America/New_York
  window_hours: 24

web:
  # Read-only item detail pages linked from drafts ("detail sits behind a link").
  enabled: true
  host: 0.0.0.0
  port: 8091
  base_url: http://localhost:8091
  # Read-only admin pages at /admin (health, messages, alerts, sign-ins). Only these Google accounts get in,
  # and only while web.login is on.
  admin:
    emails: [peter@huma.ai, eliot@huma.ai, john@huma.ai]

data:
  # Message text, raw copies, model caches and saved participant facts older than this are cleared once a day.
  # 7 years (7 x 365 + 2 leap days). Alerts keep their short quote; the audit log is kept.
  retention_days: 2557
