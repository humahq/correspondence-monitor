# The second server, cormon-edge: Peter's copy with the newest features (Eliot, 10 Nov), with its own bot account
# (bot_test@huma.ai), so it never reads or answers the live bot's mail and chat. Put in place by
#     NAME=cormon-edge LOCAL_SETTINGS=deploy/edge/settings.local.yaml ./deploy/create_vm.sh
# Email and chat stay off until the account's app password and Chat sign-in are in place
# (deploy/edge_connect.sh switches them on).
bot:
  name: "Study monitor (test)"

channels:
  email: sim
  teams: sim

mailbox:
  address: bot_test@huma.ai
  general_addresses: [bot_test+clinical@huma.ai]
  imap:
    user: bot_test@huma.ai
    secret:
      project: optical-depth-506808-t0
      name: bot-test-gmail-app-password

gchat:
  account: bot_test@huma.ai
  # Instant push, its own topic so it never mixes with the live bot's (deploy/edge_connect.sh makes them).
  events:
    topic: projects/optical-depth-506808-t0/topics/cormon-edge-chat-events
    subscription: projects/optical-depth-506808-t0/subscriptions/cormon-edge-chat-events-vm

chat:
  # The test bot's own rooms, filled in by deploy/edge_connect.sh once Eliot has made them.
  rooms: {}

memory:
  enabled: true

# Every feature is on here without listing it: create_vm.sh sets CORMON_TEST_FEATURES=all for the service.
