pattern_classes:
  - id: eligibility
    label: Eligibility
    description: A participant screened, enrolled or randomized who meets an exclusion criterion or fails an inclusion criterion, of the Master Protocol or of Regimen G.
    documents: [master, regimen_g]
    event_types: [screening, enrollment, randomization]
    match_event_types: [enrollment, randomization]
  - id: visit_schedule
    label: Visit schedule
    description: A visit, telephone visit or safety call outside its allowed window, or a visit missing a required assessment.
    documents: [regimen_g, master]
    event_types: [visit, contact, screening]
  - id: procedure_sequence
    label: Procedure order
    description: Procedures done in the wrong order, e.g. randomized before eligibility was confirmed, first dose before the baseline assessments, or spinal fluid collected after the first dose instead of before.
    documents: [regimen_g, master]
    event_types: [dosing, randomization, enrollment, visit, sample_collection]
  - id: study_drug
    label: Study drug
    description: Study drug given, changed or stopped outside the protocol (wrong dose, dose change without the required steps, missed compliance checks), or a prohibited or restricted medicine taken during the study.
    documents: [regimen_g, master]
    event_types: [dosing, visit, other]
  - id: sample_handling
    label: Sample handling
    description: Blood, DNA, urine or spinal fluid samples collected, processed or shipped outside the protocol's requirements.
    documents: [regimen_g, master]
    event_types: [sample_collection, sample_shipment, visit]
  - id: consent
    label: Informed consent
    description: Study procedures done without valid, current, signed consent, or consent process steps skipped.
    documents: [master, regimen_g]
    event_types: [consent, screening, enrollment, randomization, dosing, sample_collection]

teams:
  study_channel: { team_id: "", channel_id: "", space: "spaces/AAQAvb24ANo", name: "DNL343 Study Updates" }
  alert_channel: { team_id: "", channel_id: "", space: "spaces/AAQApsUVMPA", name: "DNL343 URGENT" }

# Study-specific tier rules, evaluated before config/triage.yaml.
triage:
  - id: study-drug-current
    description: Study drug given outside the protocol, or a prohibited medicine taken.
    when: {polarity: problem, pattern_class: study_drug, temporality: [current]}
    tier: medium
