# Eliot's test study: HEALEY ALS Platform Trial, Regimen G (DNL343, Denali).
# Sources: ClinicalTrials.gov NCT05842941 (Regimen-Specific Appendix G, V2.0, 18 Dec 2023) and
# NCT04297683 (Master Protocol V6.0, 14 Oct 2024; a scanned PDF, read by bin/ocr-pdf into master_protocol.ocr.txt).
study_id: NCT05842941
short_name: DNL343
title: HEALEY ALS Platform Trial - Regimen G (DNL343)
sponsor: Massachusetts General Hospital (Sean M. Healey & AMG Center for ALS)

# Mail to bot+<address_tag>@huma.ai is routed to this study.
address_tag: NCT05842941
monitor_signature: |-
  HEALEY Regimen G Correspondence Monitor
  (automated message from the study monitoring service; it does not review safety information)

documents:
  - id: master
    kind: protocol
    title: HEALEY ALS Platform Trial Master Protocol V6.0 (14 Oct 2024)
    version: "6.0 (14 Oct 2024)"
    file: docs/master_protocol.pdf
    guide_file: docs/master_protocol.ocr.txt   # text of the scan (bin/ocr-pdf), read for the guide
  - id: regimen_g
    kind: protocol
    title: Regimen-Specific Appendix G, DNL343, V2.0 (18 Dec 2023)
    version: "2.0 (18 Dec 2023)"
    file: docs/regimen_g.pdf
    guide_file: docs/regimen_g.docx   # the same appendix as a Word file: clean headings and tables for the guide
    overrides: [master]   # where the appendix changes a Master Protocol step, the appendix wins

# How emails are checked. "reader": the AI reads the guide sections an email is about (cormon/guide.py,
# cormon/reader.py). Any other value, or no checker block, uses the rule-by-rule checks.
# packs: the documents are combined into one pack per topic (cormon/packs.py), each split into sub-topic pieces.
# view: what the reader reads besides visit checklists: sections, packs, pieces or briefs (each topic's rules as
# short lines citing their sections). review: a second AI reviews the judge's answer before a final round (costs
# about twice as much; off). disputed: a finding the second reading rejects although its protocol words are found
# is sent as "please check" (check) or dropped (drop).
checker:
  route: reader
  documents: [regimen_g, master]
  packs: true
  view: briefs
  review: false
  code_checks: true   # dates, times and numbers checked by code on facts from the message (cormon/checks.py)

roles:
  - { id: crc, label: Study coordinator }
  - { id: cra, label: Clinical research associate }
  - { id: clinops_lead, label: Sponsor ClinOps lead }
  - { id: medical_monitor, label: Medical monitor }
  # testers may clear and disregard alerts and chat with the bot 1-on-1; no routing rule emails them
  - { id: tester, label: Study team member }

sites:
  - { id: site-01, name: "Site 01 (MGH)", aliases: [MGH, Massachusetts General] }

