# Study configuration for the demo study.
# Source: ClinicalTrials.gov NCT04098666 (protocol v2.0, 21 May 2024; ICF 5 Aug 2024).
study_id: NCT04098666
short_name: MAP
title: Metformin in Alzheimer's Dementia Prevention (MAP)
sponsor: Columbia University (funded by the National Institute on Aging)

# Mail to bot+<address_tag>@huma.ai is routed to this study.
address_tag: NCT04098666
monitor_signature: |-
  MAP Correspondence Monitor
  (automated message from the study monitoring service; it does not review safety information)

documents:
  - id: protocol
    kind: protocol
    title: MAP Protocol v2.0 (21 May 2024)
    file: docs/protocol.pdf
  - id: lab_manual
    kind: lab_manual
    title: MAP Laboratory Manual v1.0 (placeholder)
    file: docs/lab_manual.md
  - id: consent
    kind: consent
    title: MAP Informed Consent Form (5 Aug 2024)
    file: docs/consent.pdf

# Roles are defined per study; adding one needs no code change.
roles:
  - { id: crc, label: Study coordinator }
  - { id: cra, label: Clinical research associate }
  - { id: clinops_lead, label: Sponsor ClinOps lead }
  - { id: medical_monitor, label: Medical monitor }

sites:
  - { id: site-01, name: "Site 01 (Columbia)" }

people:
  - id: rohit-crc
    name: John Rohit
    email: johnrohit94@gmail.com
    roles: [crc]
    sites: [site-01]
  - id: ernest-cra
    name: John Ernest
    email: johnernest978@gmail.com
    roles: [cra]
    sites: [site-01]
  - id: john-clinops
    name: John Huma
    email: john@huma.ai
    roles: [clinops_lead]
    sites: ["*"]
  - id: medical-monitor
    name: the MAP medical monitor
    email: null
    roles: [medical_monitor]
    sites: ["*"]

# Classes of problem agreed at onboarding. Matching only looks for these.
# event_types decide which messages a class is checked against; match_event_types (optional) narrows that at
# matching time without changing the rules.
pattern_classes:
  - id: eligibility
    label: Eligibility
    description: A participant screened, enrolled or randomized who meets an exclusion criterion or fails an inclusion criterion.
    documents: [protocol]
    event_types: [screening, enrollment, randomization]
    # failing a criterion at screening is a screen fail, not a problem; it becomes one when the participant is
    # enrolled or randomized (or that is planned)
    match_event_types: [enrollment, randomization]
  - id: visit_schedule
    label: Visit schedule
    description: A visit, contact or screening procedure outside its allowed window or missing a required assessment.
    documents: [protocol]
    event_types: [visit, contact, screening]
  - id: procedure_sequence
    label: Procedure order
    description: Procedures done in the wrong order, e.g. study drug started before required imaging or before eligibility is confirmed.
    documents: [protocol]
    event_types: [dosing, imaging, randomization, enrollment]
  - id: sample_handling
    label: Sample handling
    description: Blood samples collected, processed, stored, labeled or shipped outside the lab manual's requirements.
    documents: [lab_manual]
    event_types: [sample_collection, sample_shipment, visit]
  - id: consent
    label: Informed consent
    description: Study procedures done without valid, current, signed consent, or consent process steps skipped.
    documents: [consent, protocol]
    event_types: [consent, screening, enrollment, randomization, dosing, sample_collection, imaging]

# Chat channels. Teams uses team_id and channel_id (`cormon teams-channels`); Google Chat uses space
# (`cormon chat-spaces`). The study and alert channels may be the same space.
teams:
  study_channel: { team_id: "", channel_id: "", space: "", name: "MAP study channel" }
  alert_channel: { team_id: "", channel_id: "", space: "", name: "MAP alerts" }

# Study-specific tier rules, evaluated before config/triage.yaml.
triage: []
